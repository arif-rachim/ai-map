# Shared CORS headers. Included per location because nginx drops inherited add_header
# directives in any location that declares its own. `always` keeps them on 4xx/5xx too.
add_header Access-Control-Allow-Origin * always;
add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Match, If-None-Match" always;
add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
add_header Access-Control-Max-Age 86400 always;
