# Shared response headers (CORS for any origin + request id). Included per location because nginx drops
# inherited add_header directives in any location that declares its own. `always` keeps them on 4xx/5xx too.
# No credentials are used (the API has no auth), so the wildcard origin is valid for every browser request.
add_header Access-Control-Allow-Origin * always;
add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers $cors_allow_headers always;
add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Content-Type, Accept-Ranges, ETag, Location, X-Request-Id" always;
add_header Access-Control-Max-Age 86400 always;
# Chrome Private Network Access: lets pages on other sites call this internal server.
add_header Access-Control-Allow-Private-Network true always;
add_header X-Request-Id $req_id always;
