map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/geo+json
             application/vnd.mapbox-vector-tile application/x-protobuf application/vnd.google-earth.kml+xml text/plain;

  # Offline map data: PMTiles archives (HTTP range requests), glyphs, sprites.
  location /data/ {
    alias /data/;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/cors.conf;
    if ($request_method = OPTIONS) { return 204; }
    location ~ \.pbf$ {
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=3600";
      include /etc/nginx/snippets/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
    }
    # Never expose the geocoder index or tool binaries.
    location /data/photon/ { return 404; }
  }

  # REST API, tiles/styles/OGC, Swagger UI and the real-time WebSocket (/api/v1/events).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    # nginx owns CORS; hide the API's own header (tiles routes) so it is not sent twice.
    proxy_hide_header Access-Control-Allow-Origin;
    include /etc/nginx/snippets/cors.conf;
    if ($request_method = OPTIONS) { return 204; }
  }

  # MapLibre module worker, RTL plugin, SDK bundles and examples must be served as JavaScript.
  location ~ ^/(vendor|sdk)/ {
    types {
      text/javascript js mjs;
      text/css css;
      text/html html;
      application/json map;
      text/plain ts;
    }
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/cors.conf;
    try_files $uri $uri/index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Start page (tutorial and documentation links); the map app itself is at /map.
  location = / {
    try_files /landing.html =404;
  }

  # Documentation rendered from docs/*.md at build time.
  location /docs/ {
    try_files $uri $uri/ =404;
  }

  # App at /map and /embed (the same single-page app; other sites may frame /embed).
  location / {
    try_files $uri /index.html;
  }
}
