map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# TLS for https://map.jac.mil.ae ends at the load balancer in front; keep the scheme/host it reports
# so API links match what the browser used. Without a load balancer, fall back to this request.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $http_x_forwarded_host $fwd_host {
  default $http_x_forwarded_host;
  ''      $http_host;
}

# Allow any request header in CORS preflights (echo what the browser asks for).
map $http_access_control_request_headers $cors_allow_headers {
  default $http_access_control_request_headers;
  ''      "Authorization, Content-Type, Range, If-Match, If-None-Match, X-Request-Id";
}

# ---- access log: one JSON line per request on stdout (docker logs web / aimapctl access) -----------
# Real client = first X-Forwarded-For entry set by the load balancer; else the TCP peer.
map $http_x_forwarded_for $client_ip {
  "~^\s*(?<first>[^,\s]+)" $first;
  default                    $remote_addr;
}
# Reuse the load balancer's request id when it sends one, so both logs can be joined.
map $http_x_request_id $req_id {
  default $http_x_request_id;
  ''      $request_id;
}
# Seconds with millisecond resolution ("1.042") -> integer milliseconds ("1042").
map $request_time $duration_ms {
  "~^0\.0*(?<ms>\d+)$"                $ms;
  "~^(?<s>[1-9]\d*)\.(?<ms>\d{3})$"  $s$ms;
  default                              null;
}
map $upstream_response_time $upstream_ms {
  "~^0\.0*(?<ms>\d+)$"                $ms;
  "~^(?<s>[1-9]\d*)\.(?<ms>\d{3})$"  $s$ms;
  default                              null;
}
# Skip the container's own health probes.
map "$remote_addr $request_uri" $loggable {
  "127.0.0.1 /api/v1/health" 0;
  default                    1;
}
log_format aimap escape=json
  '{"time":"$time_iso8601","client_ip":"$client_ip","lb_ip":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"duration_ms":$duration_ms,"upstream_ms":$upstream_ms,'
  '"bytes_in":$request_length,"bytes_out":$bytes_sent,"host":"$fwd_host","proto":"$fwd_proto",'
  '"origin":"$http_origin","referer":"$http_referer","user_agent":"$http_user_agent","request_id":"$req_id"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  access_log /dev/stdout aimap if=$loggable;
  # CORS + X-Request-Id for locations that declare no headers of their own.
  include /etc/nginx/snippets/cors.conf;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/geo+json
             application/vnd.mapbox-vector-tile application/x-protobuf application/vnd.google-earth.kml+xml text/plain;

  # Offline map data: PMTiles archives (HTTP range requests), glyphs, sprites.
  location /data/ {
    alias /data/;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/cors.conf;
    if ($request_method = OPTIONS) { return 204; }
    location ~ \.pbf$ {
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=3600";
      include /etc/nginx/snippets/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      # Glyph ranges that are not shipped (Arabic script was removed) answer with an empty glyph set,
      # so MapLibre skips those characters instead of logging 404s.
      error_page 404 = @empty_glyphs;
    }
    # Never expose the geocoder index or tool binaries.
    location /data/photon/ { return 404; }
  }

  location @empty_glyphs {
    default_type application/x-protobuf;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/cors.conf;
    return 200 '';
  }

  # REST API, tiles/styles/OGC, Swagger UI and the real-time WebSocket (/api/v1/events).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    # nginx owns CORS; hide the API's own header (tiles routes) so it is not sent twice.
    proxy_hide_header Access-Control-Allow-Origin;
    include /etc/nginx/snippets/cors.conf;
    if ($request_method = OPTIONS) { return 204; }
  }

  # MapLibre module worker, SDK bundles and examples must be served as JavaScript.
  location ~ ^/(vendor|sdk)/ {
    types {
      text/javascript js mjs;
      text/css css;
      text/html html;
      application/json map;
      text/plain ts;
    }
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/cors.conf;
    if ($request_method = OPTIONS) { return 204; }
    try_files $uri $uri/index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/cors.conf;
    try_files $uri =404;
  }

  # Start page (tutorial and documentation links); the map app itself is at /map.
  location = / {
    try_files /landing.html =404;
  }

  # Documentation rendered from docs/*.md at build time.
  location /docs/ {
    try_files $uri $uri/ =404;
  }

  # App at /map and /embed (the same single-page app; other sites may frame /embed).
  location / {
    try_files $uri /index.html;
  }
}
